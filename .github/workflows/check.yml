name: check

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

jobs:
  package:
    name: lint, structure, tests, bibliography against the snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No machine path, no single-user reference
        run: python3 tools/lint_generic.py
      - name: Structure
        run: python3 tools/check_structure.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests
      - name: Bibliographies, local consistency
        run: python3 skills/observational-cosmology/scripts/verify_sources.py --offline skills/*/
      - name: Bibliographies against the arXiv snapshot
        # The snapshot is loaded as the checker's cache: papers in it are not
        # requested again, so only identifiers added since the snapshot go to
        # arXiv. Refresh it with tools/make_arxiv_snapshot.py.
        run: |
          mkdir -p "$RUNNER_TEMP/cache/cosmo-skill-verify"
          cp tests/fixtures/arxiv-snapshot.json "$RUNNER_TEMP/cache/cosmo-skill-verify/arxiv.json"
          XDG_CACHE_HOME="$RUNNER_TEMP/cache" python3 skills/observational-cosmology/scripts/verify_sources.py skills/*/

  arxiv:
    name: bibliographies against arXiv, no cache
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every identifier checked at arXiv
        run: XDG_CACHE_HOME="$RUNNER_TEMP/empty" python3 skills/observational-cosmology/scripts/verify_sources.py skills/*/
